# CI روی لینوکس منبع حقیقت است. سه job برای required status check روی main:
#   lint  بدون دیتابیس: چک خود CI، gitleaks، tsc، ESLint، قرارداد API
#   test  Postgres واقعی با نقش محدود app_user: migration، db/test_schema.sql، npm test، بکاپ
#   e2e   بیلد production و Playwright با نقش محدود روی DB جدا، و smoke
# هر مرحله باید بتواند شکست بخورد؛ scripts/lint-ci.sh الگوهای پنهان‌کننده را رد می‌کند.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CI lint and file modes
        run: bash scripts/lint-ci.sh

      - name: Gitleaks (full history)
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose .

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: web
        run: npm run lint

      - name: API contract drift
        run: bash scripts/test-api-contract.sh

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: tile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # متغیرهای محیطی مقدارهای web/.env.test را override می‌کنند.
      DATABASE_URL: postgres://app_user:ci_app_pw@localhost:5432/tile_test
      TEST_ADMIN_DATABASE_URL: postgres://postgres:pw@localhost:5432/tile_test
      PGPASSWORD: pw

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Install Postgres client and backup tools
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16 zstd gnupg util-linux rsync file
          psql --version
          pg_dump --version

      - name: Fresh install (schema.sql, create-app-user.sql, apply.ts)
        working-directory: web
        env:
          DATABASE_URL: ${{ env.TEST_ADMIN_DATABASE_URL }}
          NODE_PATH: ${{ github.workspace }}/web/node_modules
        run: |
          psql -v ON_ERROR_STOP=1 -q -h localhost -U postgres -d tile_test -f ../db/schema.sql
          psql -v ON_ERROR_STOP=1 -q -h localhost -U postgres -d tile_test -f ../db/create-app-user.sql
          node --import tsx ../db/migrations/apply.ts

      - name: Schema smoke test (db/test_schema.sql)
        run: |
          psql -v ON_ERROR_STOP=1 -q -h localhost -U postgres -d postgres -c "CREATE DATABASE tile_schema_test"
          psql -v ON_ERROR_STOP=1 -q -h localhost -U postgres -d tile_schema_test -f db/schema.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d tile_schema_test -f db/test_schema.sql

      - name: Tests as app_user
        working-directory: web
        run: npm test

      - name: Backup cycle (ci-backup-test.sh)
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: tile_test
          BACKUP_GPG_PASSPHRASE: ci-test-passphrase-only-not-for-production
          BACKUP_RETENTION_DAYS: "30"
        run: bash scripts/ci-backup-test.sh

      - name: Production backup script (backup-db.sh)
        run: bash scripts/ci-backup-script-test.sh

      - name: Uploads backup cycle
        env:
          BACKUP_GPG_PASSPHRASE: ci-test-passphrase-only-not-for-production
          BACKUP_RETENTION_DAYS: "30"
        run: bash scripts/ci-uploads-backup-test.sh

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      E2E_DATABASE_URL: postgres://app_user:ci_e2e_pw@localhost:5432/tile_e2e_test
      E2E_ADMIN_DATABASE_URL: postgres://postgres:pw@localhost:5432/tile_e2e_test
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Production build
        working-directory: web
        run: npm run build

      - name: Playwright (critical path and a11y baseline)
        working-directory: web
        run: npx playwright test

      - name: Smoke as app_user
        working-directory: web
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          AUTH_SECRET: ci-secret-must-be-at-least-32-characters-long-for-tests-only
        run: |
          npm run start -- -p 3200 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors -o /dev/null http://localhost:3200/api/health
          curl -fsS -o /dev/null http://localhost:3200/api/ready
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3200/api/metrics)
          if [ "$status" != "401" ] && [ "$status" != "403" ]; then
            echo "/api/metrics باید احراز هویت بخواهد، پاسخ: $status"
            exit 1
          fi

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7

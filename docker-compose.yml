# تنها مسیر دیپلوی: production، staging و تست نصب (scripts/docker-smoke.sh) همگی همین فایل‌اند.
# راهنما: docs/GO_LIVE.md. مقادیر: .env که scripts/init-env.sh می‌سازد.
#
# دو نقش دیتابیس، همین و بس:
#   POSTGRES_USER (superuser): فقط سرویس migrate و بکاپ. مالک جدول‌ها.
#   app_user: اپ و workerها، زیر RLS. نقش و grantهایش را migrate می‌سازد.

x-logging: &logging
  # بدون سقف، لاگ Docker دیسک VPS را پر می‌کند.
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-app: &app
  image: tile-saas:${IMAGE_TAG:-local}
  build: .
  restart: unless-stopped
  # sh به SIGTERM جواب نمی‌دهد؛ بدون init هر stop ده ثانیه طول می‌کشد.
  init: true
  logging: *logging
  depends_on:
    migrate:
      condition: service_completed_successfully

x-app-env: &app-env
  DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD:?run scripts/init-env.sh}@postgres:5432/${POSTGRES_DB:-tile_saas}
  # رمزنگاری کلیدهای پیامک هم با همین است؛ گم شدنش یعنی آن کلیدها باید دوباره وارد شوند.
  AUTH_SECRET: ${AUTH_SECRET:?run scripts/init-env.sh}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env.sh}
      POSTGRES_DB: ${POSTGRES_DB:-tile_saas}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # پورت منتشر نمی‌شود: Docker از ufw رد می‌شود و دیتابیس روی اینترنت می‌افتد.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # با هر `docker compose up` یک‌بار اجرا می‌شود و تا موفق نشود اپ بالا نمی‌آید.
  migrate:
    <<: *app
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?run scripts/init-env.sh}@postgres:5432/${POSTGRES_DB:-tile_saas}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?run scripts/init-env.sh}
    command: ["node", "dist-scripts/migrate.js"]

  web:
    <<: *app
    environment:
      <<: *app-env
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-postgres}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - uploads:/app/web/private/uploads
      # فقط timestamp و حجم بکاپ برای /api/metrics
      - ./backups/status:/app/backups-status:ro
      - ./backups/status:/app/uploads-backups-status:ro
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/ready"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  # worker اگر شکست بخورد کانتینر خارج می‌شود: Docker با backoff دوباره می‌سازد
  # و `docker compose ps` آن را Restarting نشان می‌دهد، نه اینکه خطا پنهان بماند.
  worker-expire:
    <<: *app
    environment: *app-env
    command: ["sh", "-c", "while :; do node dist-scripts/expire.js || exit 1; sleep 600; done"]

  worker-outbox:
    <<: *app
    environment:
      <<: *app-env
      SMS_PROVIDER: ${SMS_PROVIDER:-log}
    command: ["sh", "-c", "while :; do node dist-scripts/outbox.js || exit 1; sleep 120; done"]

  worker-housekeeping:
    <<: *app
    environment: *app-env
    command: ["sh", "-c", "while :; do node dist-scripts/housekeeping.js || exit 1; sleep 21600; done"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      web:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?run scripts/init-env.sh}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pgdata:
  uploads:
  caddy-data:
  caddy-config:
